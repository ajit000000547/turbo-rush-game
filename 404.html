<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Turbo Rush</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #060b1a 0%, #0a1433 100%);
        color: white;
        font-family: 'Orbitron', monospace;
        display: grid;
        place-items: center;
      }
      .container {
        text-align: center;
        padding: 24px;
      }
      .code {
        font-size: 84px;
        font-weight: 900;
        background: linear-gradient(135deg, #ff2244, #ffe600);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(255, 34, 68, 0.5);
        margin-bottom: 12px;
      }
      .title {
        font-size: 28px;
        letter-spacing: 3px;
        margin-bottom: 16px;
        color: #00cfff;
        text-shadow: 0 0 12px rgba(0, 207, 255, 0.6);
      }
      .message {
        font-size: 14px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 32px;
        font-family: 'Rajdhani', sans-serif;
      }
      .button {
        display: inline-block;
        padding: 12px 28px;
        border: 2px solid #00cfff;
        background: transparent;
        color: #00cfff;
        font-family: 'Orbitron', monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      }
      .button:hover {
        background: #00cfff;
        color: #000;
        box-shadow: 0 0 20px rgba(0, 207, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <div class="title">PAGE NOT FOUND</div>
      <div class="message">The race track you're looking for doesn't exist</div>
      <a href="./index.html" class="button">⬅ Back to Game</a>
    </div>
  </body>
</html>
